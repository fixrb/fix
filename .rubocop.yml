# The target Ruby version is read from `required_ruby_version` in the gemspec.
AllCops:
  NewCops: enable

plugins:
  - rubocop-md
  - rubocop-performance
  - rubocop-rake
  - rubocop-thread_safety

# Most readable form.
Layout/HashAlignment:
  EnforcedHashRocketStyle: table
  EnforcedColonStyle: table

# The tests are a flat list of `raise unless …` checks, each one a sentence:
# an empty line after each would double their length for nothing.
Layout/EmptyLineAfterGuardClause:
  Exclude:
    - test/**/*

# Every class, module and method of the library carries a comment; YARD
# (`--fail-on-warning` in .yardopts) checks that its tags match the code.
# Enabled explicitly: the next major release of RuboCop is expected to
# disable `Style/Documentation` by default.
Style/Documentation:
  Enabled: true
  Include:
    - lib/**/*.rb

Style/DocumentationMethod:
  Enabled: true
  Include:
    - lib/**/*.rb

# `::String === object` asks String, not the object, which user code may
# have redefined: the form the library wants.
Style/CaseEquality:
  Exclude:
    - lib/**/*

# The registry of specifications is written when a file is loaded, by the
# thread that loads it, and read afterwards: a class instance variable
# replaced, never mutated.
ThreadSafety/ClassInstanceVariable:
  Exclude:
    - lib/fix.rb

# rubocop-md reads the README as one Ruby file, where the prose is comments;
# its examples are separate files, each ending with `exit`, and two of them
# define a class.
Lint/UnreachableCode:
  Exclude:
    - README.md

Style/OneClassPerFile:
  Exclude:
    - README.md

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
